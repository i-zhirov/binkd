[package]
name = "rbinkd-win-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
description = "The raw Windows file-system FFI of rbinkd."

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[lints.rust]
# The exception of `doc/development.md`: the crate holds the two raw calls of
# `GetShortPathNameW()` and `GetFileInformationByHandle()`. The optional
# feature `windows-original` of `rbinkd-win` accepts only the safe wrappers of
# this crate.
unsafe_code = "allow"

[lints.clippy]
all = "warn"
