[package]
name = "rbinkd-proto"
description = "The binkp protocol of rbinkd, the port of protocol.c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rbinkd-ftn = { path = "../rbinkd-ftn" }
# The port of `compress.c`: zlib with the pure Rust backend and bzip2.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
bzip2 = "=0.6.1"

rbinkd-spool = { path = "../rbinkd-spool" }
tokio = { version = "=1.54.0", features = ["rt", "net", "io-util", "macros", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.0", features = ["rt", "net", "io-util", "macros", "time", "rt-multi-thread"] }

[lints]
workspace = true
