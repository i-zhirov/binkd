[package]
name = "rbinkd-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Windows service mode of rbinkd, the port of `nt/service.c`."

[target.'cfg(windows)'.dependencies]
rbinkd-win-ffi = { path = "../rbinkd-win-ffi" }
windows-service = "=0.8.1"
winreg = "=0.56.0"

[lints.rust]
# The crate accepts only safe APIs. The raw calls live in `rbinkd-win-ffi`.
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
