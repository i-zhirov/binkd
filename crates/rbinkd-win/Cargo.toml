[package]
name = "rbinkd-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Windows service mode of rbinkd, the port of `nt/service.c`."

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[lints.rust]
# The exception of `doc/development.md`: the crate holds the FFI
# of the Windows service control manager, so it alone holds `allow`. Every
# other crate keeps `forbid`.
unsafe_code = "allow"

[lints.clippy]
all = "warn"
