[package]
name = "binkd-perl"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
description = "The FFI of the Perl hooks of binkd, the port of `perlhooks.c`."
build = "build.rs"

# The crate is not a member of the workspace. The default build excludes it.
# See `doc/configuration.md`.

[dependencies]
binkd-config = { path = "../binkd-config" }
binkd-ftn = { path = "../binkd-ftn" }
binkd-log = { path = "../binkd-log" }
binkd-srif = { path = "../binkd-srif" }

[dev-dependencies]
binkd-spool = { path = "../binkd-spool" }

[lints.rust]
# The exception is described in `doc/development.md`: the crate holds the C shim of
# the Perl C API and the FFI, so it alone holds `allow`. Every other crate keeps
# `forbid`.
unsafe_code = "allow"
