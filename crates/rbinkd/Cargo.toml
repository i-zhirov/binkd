[package]
name = "rbinkd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The rbinkd mailer: the Rust reimplementation of binkd, its command line and daemon."

[lib]
# The library and the executable share the rbinkd name.
name = "rbinkd"

[[bin]]
name = "rbinkd"
path = "src/main.rs"

[features]
# The Perl hooks are optional. See `doc/configuration.md`.
perl = ["dep:rbinkd-perl"]

[target.'cfg(unix)'.dependencies]
syslog = "=7.0.0"

[target.'cfg(windows)'.dependencies]
rbinkd-win = { path = "../rbinkd-win" }

[dependencies]
rbinkd-perl = { path = "../rbinkd-perl", optional = true }
rbinkd-config = { path = "../rbinkd-config" }
rbinkd-ftn = { path = "../rbinkd-ftn" }
rbinkd-net = { path = "../rbinkd-net" }
rbinkd-proto = { path = "../rbinkd-proto" }
rbinkd-log = { path = "../rbinkd-log" }
rbinkd-spool = { path = "../rbinkd-spool" }
fs2 = "=0.4.3"
time = { version = "=0.3.44", features = ["local-offset"] }
tokio = { version = "=1.54.0", features = ["rt", "rt-multi-thread", "macros", "signal", "time", "io-std", "process"] }

[dev-dependencies]
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "process"] }

[lints]
workspace = true
