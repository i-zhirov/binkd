[workspace]
resolver = "2"
members = [
    "crates/binkd-ftn",
    "crates/binkd-spool",
    "crates/binkd-config",
    "crates/binkd-proto",
    "crates/binkd-log",
    "crates/binkd-net",
    "crates/binkd-srif",
    "crates/binkd-corpus",
    "crates/rbinkd",
    "crates/binkd-win",
]
# The crate of the FFI is optional: the default build holds it not, the port of
# the decision of `doc/decisions/perl-hooks.md`.
exclude = ["crates/binkd-perl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/i-zhirov/rbinkd"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
