[workspace]
resolver = "2"
members = [
    "crates/rbinkd-ftn",
    "crates/rbinkd-spool",
    "crates/rbinkd-config",
    "crates/rbinkd-proto",
    "crates/rbinkd-log",
    "crates/rbinkd-net",
    "crates/rbinkd-srif",
    "crates/rbinkd-corpus",
    "crates/rbinkd",
    "crates/rbinkd-win",
]
# The crate of the FFI is optional and excluded from the workspace.
# See `doc/configuration.md`.
exclude = ["crates/rbinkd-perl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/i-zhirov/rbinkd"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
