include parts/child.conf
passwords pwd.txt
log ""
loglevel 5
conlog 2
binlog ""
fdinhist ""
fdouthist ""
tzoff -3h
domain fidonet outb 2
domain othernet outb 3
domain aliasnet alias-for fidonet
address 2:5047/13@fidonet 2:5047/14@fidonet
sysname "Test system"
bindaddr 127.0.0.1
listen 127.0.0.1:24554 [::1]:24555
sysop "Test sysop"
location "Test location"
nodeinfo "Test node"
iport 24554
oport binkp
rescan-delay 5m
call-delay 30s
timeout 10m
oblksize 4096
maxservers 10
maxclients 5
inbound in
inbound-nonsecure in
temp-inbound in
node 2:5047/100@fidonet host.example.com secret,packet,out i box inbox -nr -nd -md -hc -noproxy -ip
defnode host.def.example.com defpwd h - - -sip -4
kill-dup-partial-files
kill-old-partial-files 1d
kill-old-bsy 2h
percents
minfree 10
minfree-nonsecure 5
flag /tmp/flagfile "*.pkt"
exec "echo hi" "*.su?"
printq
try 3
hold 1h30m
hold-skipped 2h
backresolv
pid-file ""
remove-try-files
ftrans "/old" "/new"
send-if-pwd
root-domain "binkp.net"
prescan
connect-timeout 30s
filebox box
brakebox bbox
deletebox
skip secure !100 *.pkt *.su?
skipmask *.req
inboundcase mixed
deletedirs
overwrite "*.pkt" "*.su?"
dont-send-empty yes
rename-style postfix
share 2:5047/200@fidonet 2:5047/201@fidonet 2:5047/202@fidonet
check-pkthdr all bad
nolog "*.pkt"
hide-aka 2:5047/13@fidonet "*.pkt"
present-aka 2:5047/14@fidonet "!*.su?"
zlevel 9
zminsize 2048
zallow *.pkt
zdeny *.su?
