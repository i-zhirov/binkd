name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the workspace
        run: cargo test --workspace
      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check the format
        run: cargo fmt --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Check the minimum supported Rust version
        run: cargo +1.85.0 check --workspace

  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Perl headers
        run: sudo apt-get update && sudo apt-get install -y libperl-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the Perl example of the documentation
        working-directory: crates/rbinkd-perl
        run: cargo test --test doc_example -- --test-threads=1
      - name: Test the Perl hooks of the crate
        run: cd crates/rbinkd-perl && cargo test -- --test-threads=1
      - uses: ./.github/actions/upstream-c
      - name: Build the C oracle
        run: |
          cd upstream-c
          cp mkfls/unix/* .
          chmod +x mkinstalldirs
          ./configure --with-perl
          make
      - name: Test the hooks with the C oracle
        env:
          BINKD_C_PERL: ${{ github.workspace }}/upstream-c/binkd
        run: |
          cargo test -p rbinkd --features perl -- --test-threads=1

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the C compression headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev
      - uses: ./.github/actions/upstream-c
      - name: Build the C reference
        run: |
          cd upstream-c
          cp mkfls/unix/* .
          chmod +x mkinstalldirs
          ./configure
          make
      - name: Run the C and Rust interop suite
        env:
          BINKD_C: ${{ github.workspace }}/upstream-c/binkd
        run: |
          cargo test -p rbinkd-proto --test interop
          cargo test -p rbinkd-net --test interop
          cargo test -p rbinkd-proto --test record
          cargo test -p rbinkd-config --test dump_corpus
          cargo test -p rbinkd-config --test reload_corpus
          cargo test -p rbinkd --test cli
          cargo test -p rbinkd --test daemon
      - name: Run the binary interop suite
        env:
          BINKD_C: ${{ github.workspace }}/upstream-c/binkd
        run: cargo test -p rbinkd --test interop_binary

  interop-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the C compression headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev
      - uses: ./.github/actions/upstream-c
      - name: Build the C reference with the proxy
        run: |
          cd upstream-c
          cp mkfls/unix/* .
          chmod +x mkinstalldirs
          ./configure --with-proxy --with-ntlm
          make
      - name: Run the proxy interop suite
        env:
          BINKD_C_PROXY: ${{ github.workspace }}/upstream-c/binkd
        run: cargo test -p rbinkd-net --test proxy_interop

  interop-bwlim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the C compression headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev
      - uses: ./.github/actions/upstream-c
      - name: Build the C reference with the rate limit
        run: |
          cd upstream-c
          cp mkfls/unix/* .
          chmod +x mkinstalldirs
          ./configure --with-bwlim
          make
      - name: Run the rate limit interop test
        env:
          BINKD_C_BWLIM: ${{ github.workspace }}/upstream-c/binkd
        run: |
          cargo test -p rbinkd-proto --test interop rust_client_to_c_server_rate_limited

  interop-v10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the C compression headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libbz2-dev
      - uses: ./.github/actions/upstream-c
      - name: Build the C reference of protocol 1.0
        run: |
          cd upstream-c
          cp mkfls/unix/* .
          chmod +x mkinstalldirs
          ./configure
          make CFLAGS='-O2 -DPRTCLVER=\"1.0\"'
      - name: Run the protocol 1.0 interop tests
        env:
          BINKD_C_V10: ${{ github.workspace }}/upstream-c/binkd
        run: |
          cargo test -p rbinkd-proto --test interop c_client_claims_freq_to_rust_server
          cargo test -p rbinkd-proto --test interop c_client_skips_the_request_of_rust_server

  interop-macos:
    runs-on: macos-15-intel
    env:
      BINKD_C: ${{ github.workspace }}/upstream-c/binkd
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/upstream-c
      - name: Build the C reference
        run: |
          cd upstream-c
          cp mkfls/unix/* .
          chmod +x mkinstalldirs
          ./configure
          make
      - name: Run the C and Rust interop suite
        run: |
          cargo test -p rbinkd-proto --test interop -- --test-threads=1
          cargo test -p rbinkd-net --test interop -- --test-threads=1
          cargo test -p rbinkd-proto --test record -- --test-threads=1
          cargo test -p rbinkd-config --test dump_corpus
          cargo test -p rbinkd-config --test reload_corpus
          cargo test -p rbinkd --test cli
          cargo test -p rbinkd --test daemon -- --test-threads=1
      - name: Run the binary interop suite
        run: cargo test -p rbinkd --test interop_binary -- --test-threads=1

  interop-windows:
    runs-on: windows-latest
    env:
      BINKD_C: '${{ github.workspace }}\upstream-c\bin\mingw32-zlib-bzlib2\binkd-mingw-zlib-bzlib2.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-bzip2
      - uses: ./.github/actions/upstream-c
      - name: Build the C reference
        shell: msys2 {0}
        run: |
          cd upstream-c
          make -f mkfls/nt95-mingw/Makefile \
            CC=gcc ZLIB=1 BZLIB2=1 \
            OUTDIR=bin/mingw32-zlib-bzlib2 \
            CFLAGS='-std=gnu89 -mthreads -pipe -funsigned-char -Wall -Wno-char-subscripts -Wno-comment -O2 -s' \
            LFLAGS='-static'
          test -f bin/mingw32-zlib-bzlib2/binkd-mingw-zlib-bzlib2.exe
      - name: Run the C and Rust interop suite
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          cargo test -p rbinkd-proto --test interop -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p rbinkd-net --test interop -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p rbinkd-proto --test record -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the binary interop suite
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          cargo test -p rbinkd --test interop_binary -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the workspace
        run: cargo test --workspace
      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the service mode
        run: cargo check -p rbinkd-win -p rbinkd-win-ffi -p rbinkd
      - name: Lint the service mode
        run: cargo clippy -p rbinkd-win -p rbinkd-win-ffi -p rbinkd --all-targets -- -D warnings
      - name: Test the workspace
        run: cargo test --workspace
      - name: Build the release binary
        run: cargo build --release -p rbinkd
      - name: Run the Windows service smoke test
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/windows-smoke.ps1
