[package]
name = "binkd-proto"
description = "The binkp protocol of binkd, the port of protocol.c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
binkd-ftn = { path = "../binkd-ftn" }
binkd-spool = { path = "../binkd-spool" }
tokio = { version = "=1.54.0", features = ["rt", "net", "io-util", "macros", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.0", features = ["rt", "net", "io-util", "macros", "time", "rt-multi-thread"] }

[lints]
workspace = true
